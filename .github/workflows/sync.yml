name: sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: PYTHONPATH=scripts python3 scripts/sync_test.py
      - name: Fetch yesterday and today
        env:
          FLYAGENT_URL: ${{ secrets.FLYAGENT_URL }}
          FLYAGENT_TOKEN: ${{ secrets.FLYAGENT_TOKEN }}
        run: python3 scripts/sync.py
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "no data changes"
            exit 0
          fi
          git commit -m "chore(data): merge yesterday and today"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
